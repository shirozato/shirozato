<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">shirozato profile banner</title>
  <desc id="desc">A layered orbital dashboard with slow signal motion and a brief, subtle character glitch in shirozato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7dd3fc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64748b" stroke-opacity=".1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <radialGradient id="violet"><stop stop-color="#a78bfa" stop-opacity=".15"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .scan{animation:scan 7s linear infinite}
    .orbit{transform-origin:1010px 180px;animation:spin 18s linear infinite}
    .orbit2{transform-origin:1010px 180px;animation:spin 12s linear infinite reverse}
    .drift{animation:drift 24s ease-in-out infinite alternate}
    .haze{animation:haze 19s ease-in-out infinite alternate}
    .signal{stroke-dasharray:10 190;animation:signal 6s linear infinite}
    .ring{transform-origin:1010px 180px;animation:spin 48s linear infinite reverse}
    .core{animation:breathe 7s ease-in-out infinite}
    .sweep{animation:sweep 9s ease-in-out infinite}
    .letter{font-family:'Cascadia Code',Consolas,monospace;font-size:64px;font-weight:700}
    .clean{animation:clean 12s linear infinite}
    .glitch{opacity:0;animation:glitch 12s linear infinite;fill:#a5dffc}
    .late{animation-delay:140ms}
    @keyframes clean{0%,61.9%,65.1%,100%{opacity:1}62%,65%{opacity:0}}
    @keyframes glitch{0%,61.9%,65.1%,100%{opacity:0;transform:translateX(0)}62%,65%{opacity:.85;transform:translateX(1px)}63.5%{opacity:.65;transform:translateX(-1px)}}
    @keyframes drift{from{transform:translate(-18px,8px)}to{transform:translate(28px,-12px)}}
    @keyframes haze{from{transform:translate(0,0);opacity:.5}to{transform:translate(35px,20px);opacity:1}}
    @keyframes signal{to{stroke-dashoffset:-400}}
    @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
    @keyframes sweep{0%,15%{transform:translateX(-90px);opacity:0}25%{opacity:.65}70%{opacity:.65}85%,100%{transform:translateX(580px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(-380px)}to{transform:translateY(380px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){
      .pulse,.scan,.orbit,.orbit2,.drift,.haze,.signal,.ring,.core,.sweep,.clean,.glitch{animation:none}
      .clean{opacity:1}.glitch,.sweep,.scan{opacity:0}
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="drift" cx="980" cy="150" r="270" fill="url(#glow)" filter="url(#blur)"/>
    <circle class="haze" cx="470" cy="330" r="300" fill="url(#violet)"/>
    <path d="M740 0L660 360M815 0L735 360M890 0L810 360" stroke="#818cf8" stroke-opacity=".035" stroke-width="28"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity=".18"/>

    <g opacity=".85">
      <circle cx="1010" cy="180" r="104" fill="none" stroke="#7dd3fc" stroke-opacity=".24" stroke-dasharray="4 8" class="ring"/>
      <circle cx="1010" cy="180" r="64" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
      <circle cx="1010" cy="180" r="27" fill="#101827" stroke="#7dd3fc" stroke-width="2"/>
      <circle class="core" cx="1010" cy="180" r="42" fill="url(#glow)"/>
      <path d="M940 137A82 82 0 0 1 1084 215" fill="none" stroke="#818cf8" stroke-opacity=".28" stroke-width="2" class="ring"/>
      <path d="M997 180h26M1010 167v26" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      <g class="orbit"><circle cx="1114" cy="180" r="7" fill="#7dd3fc"/><circle cx="1114" cy="180" r="15" fill="#7dd3fc" opacity=".14"/></g>
      <g class="orbit2"><circle cx="1010" cy="116" r="6" fill="#c084fc"/><circle cx="1010" cy="116" r="14" fill="#c084fc" opacity=".16"/></g>
      <path d="M906 180H825M1074 180h72M1010 76V45M1010 284v31" stroke="#64748b" stroke-opacity=".35"/>
      <path class="signal" d="M825 180H906M1074 180H1146" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".65"/>
      <path class="signal" d="M1010 45V76M1010 284V315" fill="none" stroke="#c084fc" stroke-width="2" opacity=".55" style="animation-delay:-3s"/>
    </g>

    <g transform="translate(64 64)">
      <!-- Two isolated glyph substitutions, lasting 360 ms once per 12 s. -->
      <g transform="translate(0 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">s</text></g>
      <g transform="translate(38 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">h</text></g>
      <g transform="translate(76 0)"><text class="letter clean" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">i</text><text aria-hidden="true" class="letter glitch" y="86" textLength="36" lengthAdjust="spacingAndGlyphs">!</text></g>
      <g transform="translate(114 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">r</text></g>
      <g transform="translate(152 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">o</text></g>
      <g transform="translate(190 0)"><text class="letter clean late" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">z</text><text aria-hidden="true" class="letter glitch late" y="86" textLength="36" lengthAdjust="spacingAndGlyphs">%</text></g>
      <g transform="translate(228 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">a</text></g>
      <g transform="translate(266 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">t</text></g>
      <g transform="translate(304 0)"><text class="letter" y="86" fill="#f8fafc" textLength="36" lengthAdjust="spacingAndGlyphs">o</text></g>
      <rect x="0" y="108" width="490" height="3" rx="2" fill="url(#accent)"/>
      <rect class="sweep" x="0" y="108" width="70" height="3" rx="2" fill="#dbeafe"/>
      <g transform="translate(0 164)" class="mono" font-size="12">
        <rect width="145" height="34" rx="17" fill="#0f172a" stroke="#7dd3fc" stroke-opacity=".38"/>
        <text x="18" y="22" fill="#cbd5e1">$ ship --reliable</text>
        <path d="M165 17h74" stroke="#475569" stroke-dasharray="2 5"/>
        <circle cx="255" cy="17" r="4" fill="#a78bfa" class="pulse"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="2"/>
</svg>
