<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">BUILD WHAT OUTLASTS THE NOISE.</title>
  <desc id="desc">A quiet terminal line types a short motto, pauses, and erases it. Reduced motion shows the complete phrase.</desc>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="80" y1="34" x2="1120" y2="34">
      <stop stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".25" stop-color="#7dd3fc"/>
      <stop offset=".75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing"><rect class="reveal" x="0" y="-22" width="406" height="30"/></clipPath>
  </defs>
  <style>
    text{font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace}
    .reveal{animation:type 14s steps(30,end) infinite}
    .caret-position{animation:travel 14s steps(30,end) infinite}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    .packet{stroke-dasharray:30 1010;animation:flow 18s linear infinite}
    /* Type 3.36 s, hold 6.16 s, erase 2.38 s, rest 2.10 s. */
    @keyframes type{0%{width:0}24%,68%{width:406px}85%,100%{width:0}}
    @keyframes travel{0%{transform:translateX(0)}24%,68%{transform:translateX(406px)}85%,100%{transform:translateX(0)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-2080}}
    @media(prefers-reduced-motion:reduce){
      .reveal,.caret-position,.cursor,.packet{animation:none}
      .reveal{width:406px}.caret-position{transform:translateX(406px)}.cursor{opacity:.7}
    }
  </style>
  <path d="M80 34H1120" stroke="url(#line)" stroke-width="1" opacity=".65"/>
  <path class="packet" d="M80 34H1120" stroke="#7dd3fc" stroke-width="2" opacity=".35"/>
  <g transform="translate(389 77)">
    <text x="-25" y="0" fill="#7dd3fc" font-size="15" opacity=".65">&gt;</text>
    <g clip-path="url(#typing)"><text y="0" fill="#cbd5e1" font-size="16" textLength="406" lengthAdjust="spacingAndGlyphs">BUILD WHAT OUTLASTS THE NOISE.</text></g>
    <g class="caret-position"><rect class="cursor" x="6" y="-15" width="2" height="18" rx="1" fill="#a78bfa"/></g>
  </g>
</svg>
